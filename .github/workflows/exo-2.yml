name: build
on:
  push:


jobs:
  build:
    runs-on: windows-11
    steps:
    - uses: actions/checkout@v7


    - uses: actions/setup-node@v7
      with:
        node-version: 24.13.1

    - run: npm
    - run: npm run build

    - run: |
        if [ ! -d dist]; then
         echo ""::error:: Le dossier dist/ n'existe pas"
         exit 1
        fi
    
    - run: npm run test

    - uses: actions/upload-artifact@v7
      with:
        name: build
        path: dist/

    - run: |
       echo "## Build" >> "$GITHUB_STEP_SUMMARY"

