name: Exercice 2

on:
  push:


jobs:
  test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7


    - uses: actions/setup-node@v7
      with:
        node-version: 24.18.0



    - uses: actions/cache@v5
      with:
        path: ~/.npm
        key: npm-${{ runner.os}}-${{ hashFiles('package-lock.json') }}

    - run: npm ci

    - run: npm test

    - uses: actions/upload-artifact@v7
      with:
      name: build
      path: dist/
